<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Walking Speed, Step Count and Calorie Burn Science">
  <defs>
    <linearGradient id="walkSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="walkTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="walkCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#walkSky)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="67" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">STEP MECHANICS</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Walking Speed, Step Count &amp; Energy Expenditure</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Metabolic Equivalent of Task (METs) and fat oxidation across walking cadences</text>
  </g>

  <!-- Left: Illustrated Step Track Graphic -->
  <g transform="translate(48, 130)">
    <rect width="335" height="260" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>

    <!-- Step Goal Radial Ring -->
    <circle cx="167" cy="110" r="70" fill="none" stroke="#334155" stroke-width="12"/>
    <circle cx="167" cy="110" r="70" fill="none" stroke="url(#walkTrail)" stroke-width="12" stroke-linecap="round" stroke-dasharray="380 440"/>

    <!-- Central Step Metrics -->
    <text x="167" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">10,000</text>
    <text x="167" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">STEPS / DAY</text>
    <text x="167" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">~4.5–5.0 miles • ~400 kcal</text>

    <!-- Bottom Footprint Pace Metrics -->
    <g transform="translate(30, 205)">
      <rect width="275" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="137" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">
        Zone 2 Cardio: <tspan fill="#34d399" font-weight="700">65–75% of calories</tspan> burned from stored fat
      </text>
    </g>
  </g>

  <!-- Right: 3 Metric Cards -->
  <!-- Card 1: Casual Stroll -->
  <g transform="translate(415, 130)" filter="url(#walkCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#64748b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Casual Stroll (2.0–2.5 mph)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">2.8–3.0 METs • Gentle stroll, active recovery</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">~160–220 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#64748b">2.8</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 2: Brisk Aerobic Walking -->
  <g transform="translate(415, 221)" filter="url(#walkCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#10b981"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Brisk Walk (3.5 mph / 5.6 km/h)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">4.3 METs • Gold standard fat oxidation zone</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981">~270–360 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#059669">4.3</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 3: Power Walk / Incline Hike -->
  <g transform="translate(415, 312)" filter="url(#walkCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#06b6d4"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Power Walk / Hill Incline (4.0+ mph)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">5.0–7.0 METs • High posterior chain engagement</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#06b6d4">~380–500+ kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0891b2">5.0+</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>
</svg>
