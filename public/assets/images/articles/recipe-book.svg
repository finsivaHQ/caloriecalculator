<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Recipe Calorie Calculation and Portion Science Diagram">
  <defs>
    <linearGradient id="recipeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="recipeCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#recipeSky)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="67" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">CULINARY SCIENCE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Recipe Calorie Calculation &amp; Portion Division</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Mastering ingredient summation, water evaporation loss, and per-serving precision</text>
  </g>

  <!-- Left: Recipe Batch Pot Graphic -->
  <g transform="translate(48, 130)">
    <rect width="335" height="260" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Batch Pot Calculation Flow</text>

    <!-- Raw Ingredients Box -->
    <g transform="translate(24, 45)">
      <rect width="287" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">1. Sum Raw Ingredients</text>
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Chicken (825) + Rice (650) + Oil (240) = <tspan fill="#f59e0b" font-weight="700">1,715 kcal</tspan></text>
    </g>

    <!-- Arrow Down -->
    <text x="167" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">↓</text>

    <!-- Finished Cooked Weight Box -->
    <g transform="translate(24, 120)">
      <rect width="287" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">2. Weigh Total Cooked Yield</text>
      <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Finished batch weight on scale: <tspan fill="#38bdf8" font-weight="700">1,200 grams</tspan></text>
    </g>

    <!-- Arrow Down -->
    <text x="167" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">↓</text>

    <!-- Per Serving Division Box -->
    <g transform="translate(24, 195)">
      <rect width="287" height="48" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#34d399">3. Divide by Portions (e.g. 4 Servings)</text>
      <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#f8fafc">300g per bowl = <tspan fill="#34d399">429 kcal / serving</tspan></text>
    </g>
  </g>

  <!-- Right: 3 Rules Cards -->
  <!-- Card 1: Raw vs Cooked Rule -->
  <g transform="translate(415, 130)" filter="url(#recipeCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#f59e0b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Water Evaporation &amp; Caloric Density</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Cooking evaporates water, concentrating calories</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">100g cooked meat has ~30% more kcal than raw</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f59e0b">DENSITY</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">SHIFTS</text>
  </g>

  <!-- Card 2: Hidden Calories in Cooking Oils -->
  <g transform="translate(415, 221)" filter="url(#recipeCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#ef4444"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Cooking Oils &amp; Fats (120 kcal / Tbsp)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Olive oil, butter, and dressings add dense energy</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f87171">Always weigh pan oils directly on a gram scale</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ef4444">120 kcal</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PER TBSP</text>
  </g>

  <!-- Card 3: Gram Scale Precision -->
  <g transform="translate(415, 312)" filter="url(#recipeCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#10b981"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Digital Gram Scale vs. Measuring Cups</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Cups introduce 20–30% error via volume packing</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">Gram scales eliminate guesswork for exact tracking</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#10b981">±1g</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">ACCURACY</text>
  </g>
</svg>
