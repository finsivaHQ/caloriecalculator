<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Protein Grams to Calories Conversion Science Diagram">
  <defs>
    <linearGradient id="convertSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="convertCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#convertSky)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="145" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="72" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ENERGY CONVERSION</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Protein Grams to Calories (Kcal) Conversion</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">The Atwater energy framework: 1 gram of protein provides exactly 4 kilocalories</text>
  </g>

  <!-- Left: Interactive Conversion Equation Graphic -->
  <g transform="translate(48, 130)">
    <rect width="335" height="260" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>

    <!-- Central Formula Box -->
    <g transform="translate(24, 30)">
      <rect width="287" height="65" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="143" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">ATWATER GOLD-STANDARD FORMULA</text>
      <text x="143" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">Calories = Protein (g) × 4</text>
    </g>

    <!-- Visual Bidirectional Converter Scale -->
    <g transform="translate(24, 115)">
      <!-- Left: 1g Protein Pill -->
      <rect x="0" y="0" width="115" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <text x="57" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">PROTEIN MASS</text>
      <text x="57" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle">1 Gram</text>

      <!-- Bidirectional Arrow -->
      <text x="143" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">⇄</text>

      <!-- Right: 4 kcal Pill -->
      <rect x="172" y="0" width="115" height="60" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="229" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">HEAT ENERGY</text>
      <text x="229" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">4.0 kcal</text>
    </g>

    <!-- Bottom TEF Note -->
    <g transform="translate(24, 195)">
      <rect width="287" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="143" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">
        Thermic Effect of Food (TEF): <tspan fill="#f59e0b">20–30%</tspan>
      </text>
      <text x="143" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
        Net metabolized energy yield: ~2.8 to 3.2 kcal / gram
      </text>
    </g>
  </g>

  <!-- Right: 3 Quick Conversion Target Cards -->
  <!-- Card 1: 100g Target -->
  <g transform="translate(415, 130)" filter="url(#convertCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#38bdf8"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">100 Grams of Protein</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">100g × 4 kcal/g = 400 kcal</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">~2 chicken breasts or 4 scoops whey</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0284c7">400</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">KCAL</text>
  </g>

  <!-- Card 2: 150g Target -->
  <g transform="translate(415, 221)" filter="url(#convertCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#10b981"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">150 Grams of Protein</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">150g × 4 kcal/g = 600 kcal</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">Standard target for a 75 kg (165 lb) athlete</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#10b981">600</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">KCAL</text>
  </g>

  <!-- Card 3: 200g Target -->
  <g transform="translate(415, 312)" filter="url(#convertCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#8b5cf6"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">200 Grams of Protein</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">200g × 4 kcal/g = 800 kcal</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Heavy hypertrophy bodybuilding protocol</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#8b5cf6">800</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">KCAL</text>
  </g>
</svg>
