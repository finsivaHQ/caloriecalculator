<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Protein Intake Diminishing Returns and Muscle Protein Synthesis Saturation Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="excessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="518" rx="19" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header Banner -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="165" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="82" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SCIENTIFIC REALITY</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f9fafb">Daily Protein Intake: Diminishing Returns Curve</text>
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af">What human biochemistry reveals about the muscle protein synthesis (MPS) ceiling.</text>
  </g>

  <!-- 3 Intake Tiers Cards -->
  <g transform="translate(40, 130)">
    
    <!-- Tier 1: Sedentary RDA -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="225" height="270" rx="14" fill="#131d31" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="14" y="14" width="197" height="32" rx="8" fill="#1e293b"/>
      <text x="112" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle">RDA BASELINE</text>
      
      <text x="112" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">0.8 g/kg</text>
      <text x="112" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">~46 – 56g per day</text>

      <path d="M 20 115 L 205 115" stroke="#334155" stroke-width="1"/>

      <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Who it's for:</text>
      <text x="20" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Sedentary adults, non-lifters</text>

      <text x="20" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Primary Function:</text>
      <text x="20" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">• Prevents nitrogen deficiency</text>
      <text x="20" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">• Sustains cellular turnover</text>
      <text x="20" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">• Fully met via balanced diet</text>
    </g>

    <!-- Tier 2: Active / Athletic Optimum -->
    <g transform="translate(247, 0)" filter="url(#cardShadow)">
      <rect width="225" height="270" rx="14" fill="#062d22" stroke="#10b981" stroke-opacity="0.8" stroke-width="2"/>
      <rect x="14" y="14" width="197" height="32" rx="8" fill="url(#optGrad)"/>
      <text x="112" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#022c22" text-anchor="middle">SWEET SPOT (OPTIMAL)</text>
      
      <text x="112" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#34d399" text-anchor="middle">1.2 – 1.6 g/kg</text>
      <text x="112" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">~85 – 130g per day</text>

      <path d="M 20 115 L 205 115" stroke="#065f46" stroke-width="1"/>

      <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ecfdf5">Who it's for:</text>
      <text x="20" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">Lifters, runners, active adults</text>

      <text x="20" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ecfdf5">Maximum Benefits:</text>
      <text x="20" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a7f3d0">• 100% Muscle Synthesis capped</text>
      <text x="20" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a7f3d0">• Preserves muscle during cut</text>
      <text x="20" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a7f3d0">• High satiety &amp; recovery</text>
    </g>

    <!-- Tier 3: Excess / Fitness Culture -->
    <g transform="translate(495, 0)" filter="url(#cardShadow)">
      <rect width="225" height="270" rx="14" fill="#2d1215" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
      <rect x="14" y="14" width="197" height="32" rx="8" fill="#451a1a"/>
      <text x="112" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f87171" text-anchor="middle">DIMINISHING RETURNS</text>
      
      <text x="112" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#fca5a5" text-anchor="middle">&gt; 2.2 g/kg</text>
      <text x="112" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f87171" text-anchor="middle">200g+ per day</text>

      <path d="M 20 115 L 205 115" stroke="#5c2020" stroke-width="1"/>

      <text x="20" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fee2e2">The Marketing Trap:</text>
      <text x="20" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fca5a5">Over-hyped by supplement brands</text>

      <text x="20" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fee2e2">What Happens:</text>
      <text x="20" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fca5a5">• ZERO additional muscle gain</text>
      <text x="20" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fca5a5">• Deaminated &amp; burned as fuel</text>
      <text x="20" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fca5a5">• Expensive urea &amp; gut distress</text>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(40, 425)">
    <rect width="720" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#10b981">THE PER-MEAL CEILING:</text>
    <text x="175" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e2e8f0">Your body utilizes ~25 to 35g of protein per meal for Muscle Protein Synthesis.</text>
    <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Excess amino acids beyond this threshold are oxidized for energy or converted via the urea cycle—not converted into more muscle tissue.</text>
  </g>
</svg>