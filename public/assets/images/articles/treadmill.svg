<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Treadmill Incline and Speed Calorie Burn Mechanics">
  <defs>
    <linearGradient id="treadDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="consoleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="treadCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#treadDark)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="145" height="24" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
    <text x="72" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CARDIO METRICS</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Treadmill Incline, Speed &amp; Energy Burn</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">How elevation gradient and belt velocity multiply metabolic workload</text>
  </g>

  <!-- Treadmill Hardware Graphic (Left) -->
  <g transform="translate(48, 140)">
    <rect width="330" height="250" rx="16" fill="url(#consoleGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Incline Base Deck (12% angle tilt) -->
    <g transform="translate(40, 170) rotate(-10)">
      <!-- Deck Frame -->
      <rect x="0" y="0" width="220" height="18" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
      <!-- Running Belt -->
      <rect x="10" y="2" width="200" height="14" rx="6" fill="#0f172a"/>
      <!-- Rollers -->
      <circle cx="15" cy="9" r="6" fill="#64748b"/>
      <circle cx="205" cy="9" r="6" fill="#64748b"/>
    </g>

    <!-- Uprights and Handrails -->
    <path d="M75 190 L95 80 L185 80" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M185 80 L205 155" stroke="#475569" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Console Dashboard Display -->
    <rect x="80" y="55" width="85" height="40" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="122" y="72" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">12% INC</text>
    <text x="122" y="87" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">3.5 MPH</text>

    <!-- Incline Lift Hydraulic Cylinder -->
    <rect x="65" y="190" width="14" height="30" rx="4" fill="#38bdf8"/>
    <rect x="50" y="220" width="60" height="8" rx="4" fill="#475569"/>

    <text x="165" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Vertical Mechanical Work = m × g × h</text>
  </g>

  <!-- 3 Comparison Cards (Right) -->
  <!-- Card 1: Flat Walking (0% Incline) -->
  <g transform="translate(415, 140)" filter="url(#treadCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#64748b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Flat Walk (3.5 mph / 0% Incline)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">3.5 METs • Gentle horizontal locomotion</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">~240–300 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#64748b">1.0×</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">BASELINE</text>
  </g>

  <!-- Card 2: 12-3-30 Incline Walk (12% Incline) -->
  <g transform="translate(415, 226)" filter="url(#treadCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#f59e0b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Incline Hike (3.0 mph / 12% Incline)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">8.0 METs • High posterior chain engagement</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">~550–650 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#d97706">2.3×</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">BURN RATE</text>
  </g>

  <!-- Card 3: Incline Jog / Sprint -->
  <g transform="translate(415, 312)" filter="url(#treadCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#ef4444"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Treadmill Jog / Run (6.0 mph / 2%)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">10.0+ METs • High cardiovascular stimulus</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ef4444">~700–850+ kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#dc2626">3.0×</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">BURN RATE</text>
  </g>
</svg>
