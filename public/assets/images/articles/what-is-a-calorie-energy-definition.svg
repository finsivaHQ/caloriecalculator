<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="What is a Calorie Science Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="598" rx="27" fill="none" stroke="#2a364f" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="67" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">ENERGY SCIENCE</text>
    <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">What is a Calorie? The Physics of Food Energy</text>
    <text x="0" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">The biological energy required to heat 1 kilogram of water by 1° Celsius (1 kcal = 4.184 kJ).</text>
  </g>

  <!-- Left Illustration: Thermodynamic Beaker -->
  <g transform="translate(60, 160)">
    <rect width="320" height="380" rx="20" fill="#161f33" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="160" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Physical Thermodynamic Definition</text>

    <!-- Beaker container -->
    <path d="M90 80 L90 260 Q90 280 110 280 L210 280 Q230 280 230 260 L230 80" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 80 L240 80" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Water liquid inside -->
    <path d="M92 140 Q160 148 228 140 L228 260 Q228 278 210 278 L110 278 Q92 278 92 260 Z" fill="url(#waterGrad)"/>
    <text x="160" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1,000 g H₂O (1 kg)</text>

    <!-- Thermometer Probe -->
    <rect x="157" y="55" width="6" height="150" rx="3" fill="#e2e8f0"/>
    <circle cx="160" cy="205" r="9" fill="#ef4444"/>
    <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">+1.0°C</text>

    <!-- Burner flame underneath -->
    <g transform="translate(160, 310)" filter="url(#glow)">
      <path d="M0 0 C 15 -15 12 -35 0 -45 C -12 -35 -15 -15 0 0 Z" fill="url(#fireGrad)"/>
    </g>
    <text x="160" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">1 kcal (1 Dietary Calorie)</text>
  </g>

  <!-- Right Panel: Macronutrient Breakdown -->
  <g transform="translate(415, 160)">
    <rect width="325" height="380" rx="20" fill="#161f33" stroke="#334155" stroke-width="1.5"/>
    <text x="162" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Metabolic Energy Yield per Gram</text>

    <!-- Card 1: Protein -->
    <g transform="translate(20, 60)">
      <rect width="285" height="66" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#2563eb"/>
      <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">P</text>
      <text x="52" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Protein</text>
      <text x="52" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Tissue repair, enzymes, lean mass</text>
      <text x="265" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#60a5fa" text-anchor="end">4 kcal/g</text>
    </g>

    <!-- Card 2: Carbohydrates -->
    <g transform="translate(20, 138)">
      <rect width="285" height="66" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#d97706"/>
      <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
      <text x="52" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Carbohydrates</text>
      <text x="52" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Primary anaerobic fuel &amp; brain glucose</text>
      <text x="265" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fbbf24" text-anchor="end">4 kcal/g</text>
    </g>

    <!-- Card 3: Dietary Fats -->
    <g transform="translate(20, 216)">
      <rect width="285" height="66" rx="12" fill="#0f172a" stroke="#db2777" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#db2777"/>
      <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
      <text x="52" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Dietary Fats</text>
      <text x="52" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Hormone synthesis &amp; dense energy</text>
      <text x="265" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#f472b6" text-anchor="end">9 kcal/g</text>
    </g>

    <!-- Bottom summary badge -->
    <rect x="20" y="300" width="285" height="52" rx="10" fill="#1e293b"/>
    <text x="162" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">TOTAL DAILY CALORIC SUM</text>
    <text x="162" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Total kcal = (P×4) + (C×4) + (F×9) + (Alc×7)</text>
  </g>
</svg>
