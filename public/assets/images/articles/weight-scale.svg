<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Energy Balance and Calorie Deficit Science Diagram">
  <defs>
    <linearGradient id="deficitSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="deficitCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#deficitSky)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="67" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ENERGY BALANCE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">The Calorie Deficit &amp; Fat Loss Equation</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Thermodynamic energy balance: Energy Out (TDEE) &gt; Energy In (Food Intake)</text>
  </g>

  <!-- Left: Illustrated Precision Scale Graphic -->
  <g transform="translate(48, 130)">
    <rect width="335" height="260" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>

    <!-- Scale Central Fulcrum & Stand -->
    <path d="M167 195 L145 225 L190 225 Z" fill="#475569"/>
    <rect x="164" y="90" width="6" height="110" rx="3" fill="#64748b"/>
    <circle cx="167" cy="90" r="8" fill="#38bdf8"/>

    <!-- Tilted Scale Beam (Right side heavier / Energy Out down) -->
    <!-- Angle: ~12 degrees tilt -->
    <g transform="rotate(12 167 90)">
      <rect x="47" y="87" width="240" height="6" rx="3" fill="url(#goldBeam)"/>
      
      <!-- Left Pan (Energy In: Higher up = Lighter) -->
      <line x1="60" y1="90" x2="40" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="60" y1="90" x2="80" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M30 135 Q60 150 90 135 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <!-- Food Intake Icon / Text -->
      <text x="60" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">CALORIES IN</text>
      <text x="60" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">1,800 kcal</text>

      <!-- Right Pan (Energy Out: Lower down = Heavier) -->
      <line x1="274" y1="90" x2="254" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="274" y1="90" x2="294" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M244 135 Q274 150 304 135 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <!-- Energy Out Icon / Text -->
      <text x="274" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">CALORIES OUT</text>
      <text x="274" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">2,300 kcal</text>
    </g>

    <!-- Bottom Deficit Indicator -->
    <g transform="translate(30, 205)">
      <rect width="275" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="137" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
        Net Deficit: <tspan fill="#34d399">-500 kcal / day</tspan> (~1 lb fat/wk)
      </text>
    </g>
  </g>

  <!-- Right: 3 Deficit Strategy Cards -->
  <!-- Card 1: Moderate Deficit -->
  <g transform="translate(415, 130)" filter="url(#deficitCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#10b981"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Conservative Deficit (-250 to -300 kcal)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~0.5 lb / week • 100% muscle retention</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">Ideal for lean individuals &amp; strength athletes</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#10b981">10–15%</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">DEFICIT</text>
  </g>

  <!-- Card 2: Standard Deficit (The Sweet Spot) -->
  <g transform="translate(415, 221)" filter="url(#deficitCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#0284c7"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Standard Deficit (-500 kcal / day)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~1.0 lb / week • Gold standard fat loss target</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Optimal balance of fat loss, energy &amp; satiety</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0284c7">20–25%</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">DEFICIT</text>
  </g>

  <!-- Card 3: Aggressive Deficit -->
  <g transform="translate(415, 312)" filter="url(#deficitCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#f59e0b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Aggressive Deficit (-750 to -1,000 kcal)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~1.5–2.0 lbs / week • High metabolic adaptation risk</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Best for short sprint phases or higher body fat</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#d97706">30%+</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">DEFICIT</text>
  </g>
</svg>
