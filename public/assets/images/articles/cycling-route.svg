<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cycling Calorie Burn and Speed Mechanics Diagram">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flameOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#skyGrad)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Badge & Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
    <text x="65" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">EXERCISE SCIENCE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Cycling Speed, Intensity &amp; Caloric Expenditure</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Metabolic Equivalent of Task (METs) and power output dynamics across cycling paces</text>
  </g>

  <!-- Road & Terrain Horizon -->
  <g transform="translate(0, 150)">
    <!-- Hills silhouette -->
    <path d="M0 130 Q160 80 320 120 T640 90 T800 110 L800 300 L0 300 Z" fill="#1e293b" fill-opacity="0.6"/>
    <!-- Road Base -->
    <path d="M0 160 L800 160 L800 300 L0 300 Z" fill="url(#roadGrad)"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Road dashed lane markings -->
    <line x1="40" y1="210" x2="140" y2="210" stroke="#64748b" stroke-width="3" stroke-dasharray="16 16"/>
    <line x1="200" y1="210" x2="300" y2="210" stroke="#64748b" stroke-width="3" stroke-dasharray="16 16"/>
    <line x1="360" y1="210" x2="460" y2="210" stroke="#64748b" stroke-width="3" stroke-dasharray="16 16"/>
    <line x1="520" y1="210" x2="620" y2="210" stroke="#64748b" stroke-width="3" stroke-dasharray="16 16"/>
    <line x1="680" y1="210" x2="780" y2="210" stroke="#64748b" stroke-width="3" stroke-dasharray="16 16"/>
  </g>

  <!-- Central Visual: Stylized Road Bike & Cyclist Silhouette -->
  <g transform="translate(110, 200)">
    <!-- Back Wheel -->
    <circle cx="50" cy="90" r="38" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="50" cy="90" r="30" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="50" cy="90" r="6" fill="#38bdf8"/>
    
    <!-- Front Wheel -->
    <circle cx="180" cy="90" r="38" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="180" cy="90" r="30" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="180" cy="90" r="6" fill="#38bdf8"/>

    <!-- Bike Frame Geometry -->
    <!-- Bottom bracket -->
    <circle cx="110" cy="90" r="8" fill="#f8fafc"/>
    <!-- Chainstay -->
    <line x1="50" y1="90" x2="110" y2="90" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat stay -->
    <line x1="50" y1="90" x2="95" y2="35" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="110" y1="90" x2="95" y2="35" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat post & Saddle -->
    <line x1="95" y1="35" x2="90" y2="22" stroke="#f8fafc" stroke-width="4"/>
    <path d="M76 22 Q92 18 106 22" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="110" y1="90" x2="160" y2="35" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="95" y1="35" x2="160" y2="35" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <!-- Head tube & Fork -->
    <line x1="160" y1="35" x2="180" y2="90" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="35" x2="157" y2="20" stroke="#f8fafc" stroke-width="4"/>
    <!-- Drop Handlebars -->
    <path d="M152 20 L166 20 Q174 24 170 34" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Kinetic Speed Streamlines -->
    <line x1="2" y1="65" x2="35" y2="65" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
    <line x1="-15" y1="85" x2="25" y2="85" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8"/>
    <line x1="5" y1="105" x2="30" y2="105" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>

  <!-- 3 Metric Cards on Right Side -->
  <!-- Card 1: Moderate Endurance Pace -->
  <g transform="translate(420, 140)" filter="url(#cardGlow)">
    <rect width="330" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#38bdf8"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Moderate Pace (12–14 mph)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">8.0 METs • Sustained Zone 2 aerobic base</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">~480–650 kcal / hr</text>
    <text x="260" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0284c7">8.0</text>
    <text x="260" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 2: Vigorous Group Pace -->
  <g transform="translate(420, 226)" filter="url(#cardGlow)">
    <rect width="330" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#f59e0b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Vigorous Pace (14–16 mph)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">10.0 METs • Threshold tempo, higher drag</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">~600–850 kcal / hr</text>
    <text x="260" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#d97706">10.0</text>
    <text x="260" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 3: Race / High Intensity Pace -->
  <g transform="translate(420, 312)" filter="url(#cardGlow)">
    <rect width="330" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#ef4444"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Fast / Race Pace (&gt;16 mph / &gt;26 km/h)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">12.0–15.8 METs • Anaerobic effort, max burn</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ef4444">~720–1,050+ kcal / hr</text>
    <text x="260" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#dc2626">12.0+</text>
    <text x="260" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Aerodynamic Formula Note Bottom-Left -->
  <g transform="translate(48, 395)">
    <rect width="320" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      Aerodynamic Drag Power: <tspan font-weight="700" fill="#38bdf8">P ∝ v³</tspan> (Doubling speed requires 8× power)
    </text>
  </g>
</svg>
