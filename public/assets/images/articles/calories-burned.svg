<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Exercise Energy Expenditure and Calorie Burn Comparison">
  <defs>
    <linearGradient id="bgDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="burnCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgDarkGrad)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#ea580c" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
    <text x="70" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="1">ENERGY EXPENDITURE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Exercise Calorie Burn &amp; MET Spectrum</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Comparative metabolic cost of cardio, resistance training, and aerobic activities</text>
  </g>

  <!-- Left: Visual Bar Chart of Activities -->
  <g transform="translate(48, 130)">
    <rect width="340" height="270" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Calories Burned per 60 Min (70 kg Adult)</text>

    <!-- Walking Bar -->
    <text x="24" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Walking (3.5 mph)</text>
    <rect x="24" y="80" width="115" height="14" rx="7" fill="#64748b"/>
    <text x="148" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">280 kcal</text>

    <!-- Weightlifting Bar -->
    <text x="24" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Weightlifting / Resistance</text>
    <rect x="24" y="130" width="145" height="14" rx="7" fill="#3b82f6"/>
    <text x="178" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">360 kcal</text>

    <!-- Cycling Bar -->
    <text x="24" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Cycling (12–14 mph)</text>
    <rect x="24" y="180" width="225" height="14" rx="7" fill="#0ea5e9"/>
    <text x="258" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">560 kcal</text>

    <!-- Running Bar -->
    <text x="24" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Running (6 mph / 10 min/mi)</text>
    <rect x="24" y="230" width="280" height="14" rx="7" fill="#f97316"/>
    <text x="24" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fb923c">700 kcal</text>
  </g>

  <!-- Right: 3 Key Formula & Metric Cards -->
  <!-- Card 1: MET Formula -->
  <g transform="translate(415, 130)" filter="url(#burnCardGlow)">
    <rect width="335" height="82" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="82" rx="3" fill="#3b82f6"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Standardized MET Equation</text>
    <text x="24" y="48" font-family="monospace" font-size="12" fill="#38bdf8">Calories = (MET × 3.5 × kg / 200) × min</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Compendium of Physical Activities gold-standard</text>
  </g>

  <!-- Card 2: EPOC Afterburn Effect -->
  <g transform="translate(415, 224)" filter="url(#burnCardGlow)">
    <rect width="335" height="82" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="82" rx="3" fill="#f59e0b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">EPOC (Excess Post-Exercise Oxygen)</text>
    <text x="24" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Intense exercise elevates resting burn 6–15%</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f59e0b">Post-workout energy recovery for up to 24 hrs</text>
  </g>

  <!-- Card 3: Body Mass Scaling -->
  <g transform="translate(415, 318)" filter="url(#burnCardGlow)">
    <rect width="335" height="82" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="82" rx="3" fill="#10b981"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Linear Body Mass Relationship</text>
    <text x="24" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Calorie burn scales directly with total body weight</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10b981">A 90 kg person burns ~28% more than a 70 kg person</text>
  </g>
</svg>
