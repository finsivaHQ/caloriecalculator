<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Swimming Calorie Burn and Stroke Mechanics Diagram">
  <defs>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="waterSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="poolCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="#0b1329"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1"/>
    <text x="65" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AQUATIC SCIENCE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Swimming Stroke Intensity &amp; Energy Burn</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Metabolic Equivalent of Task (METs) and hydrodynamics across swimming styles</text>
  </g>

  <!-- Pool Lanes Illustration (Left) -->
  <g transform="translate(48, 140)">
    <rect width="330" height="250" rx="16" fill="url(#poolGrad)" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Water lane lines -->
    <line x1="20" y1="65" x2="310" y2="65" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" stroke-opacity="0.5"/>
    <line x1="20" y1="125" x2="310" y2="125" stroke="#f43f5e" stroke-width="3" stroke-dasharray="12 6" stroke-opacity="0.7"/>
    <line x1="20" y1="185" x2="310" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" stroke-opacity="0.5"/>

    <!-- Swimmer Silhouette in Center Lane -->
    <!-- Head & Cap -->
    <circle cx="120" cy="115" r="12" fill="#f8fafc"/>
    <ellipse cx="118" cy="114" rx="10" ry="8" fill="#38bdf8"/>
    <!-- Body / Torso -->
    <path d="M130 118 Q165 116 200 123 Q165 128 130 124 Z" fill="#f8fafc"/>
    <!-- Leading Arm (Freestyle reach) -->
    <path d="M125 115 Q100 100 75 106" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Trailing Arm -->
    <path d="M160 120 Q190 105 210 112" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Legs / Flutter Kick -->
    <path d="M200 123 Q225 118 245 112" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M200 123 Q225 128 245 134" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Water Splash & Ripples -->
    <path d="M60 106 Q70 95 80 106" stroke="#bae6fd" stroke-width="2" fill="none"/>
    <path d="M245 110 Q255 100 265 112" stroke="#bae6fd" stroke-width="2" fill="none"/>
    <path d="M245 132 Q255 142 265 130" stroke="#bae6fd" stroke-width="2" fill="none"/>

    <text x="165" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">Full-Body Hydrodynamic Resistance</text>
  </g>

  <!-- 3 Metric Cards (Right) -->
  <!-- Card 1: Leisure Breaststroke -->
  <g transform="translate(415, 140)" filter="url(#poolCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#38bdf8"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Breaststroke / Leisure</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">5.3 METs • Low impact, steady aerobic pace</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">~370–490 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0284c7">5.3</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 2: Freestyle / Front Crawl -->
  <g transform="translate(415, 226)" filter="url(#poolCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#06b6d4"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Freestyle (Moderate to Vigorous)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">8.3–10.0 METs • High muscle recruitment</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#06b6d4">~580–800 kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0891b2">8.3+</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>

  <!-- Card 3: Butterfly Stroke -->
  <g transform="translate(415, 312)" filter="url(#poolCardGlow)">
    <rect width="335" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="74" rx="3" fill="#ef4444"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Butterfly Stroke (Max Intensity)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">13.8 METs • Peak power, explosive propulsion</text>
    <text x="24" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ef4444">~850–1,100+ kcal / hr</text>
    <text x="270" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#dc2626">13.8</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">METs</text>
  </g>
</svg>
