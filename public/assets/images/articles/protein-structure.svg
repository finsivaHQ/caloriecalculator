<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Protein Synthesis and Daily Intake Targets Science Diagram">
  <defs>
    <linearGradient id="proteinSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="proteinCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#proteinSky)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#7c3aed" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="67" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">AMINO SCIENCE</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Dietary Protein Synthesis, Amino Acids &amp; Targets</text>
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">The biochemical foundation of nitrogen retention, muscle repair, and satiety</text>
  </g>

  <!-- Left: Polypeptide Amino Acid Chain Graphic -->
  <g transform="translate(48, 130)">
    <rect width="335" height="260" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Essential Amino Acid Polypeptide Chain</text>

    <!-- Peptide chain ribbon curve -->
    <path d="M40 90 Q90 60 140 100 T240 110 T300 80" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="6 4"/>

    <!-- Amino Acid Nodes -->
    <!-- Node 1: Leucine (Trigger) -->
    <g transform="translate(45, 90)">
      <circle cx="0" cy="0" r="18" fill="#8b5cf6"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">LEU</text>
      <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#c4b5fd" text-anchor="middle">mTOR Trigger</text>
    </g>

    <!-- Node 2: Isoleucine -->
    <g transform="translate(100, 70)">
      <circle cx="0" cy="0" r="15" fill="#3b82f6"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">ILE</text>
    </g>

    <!-- Node 3: Valine -->
    <g transform="translate(155, 105)">
      <circle cx="0" cy="0" r="15" fill="#06b6d4"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">VAL</text>
    </g>

    <!-- Node 4: Lysine -->
    <g transform="translate(210, 110)">
      <circle cx="0" cy="0" r="15" fill="#10b981"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">LYS</text>
    </g>

    <!-- Node 5: Methionine -->
    <g transform="translate(265, 85)">
      <circle cx="0" cy="0" r="15" fill="#f59e0b"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">MET</text>
    </g>

    <!-- Bottom Leucine Threshold Pill -->
    <g transform="translate(24, 185)">
      <rect width="287" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="143" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">
        The Leucine Threshold: <tspan fill="#a78bfa">2.5–3.0g</tspan>
      </text>
      <text x="143" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
        Maximally activates Muscle Protein Synthesis (MPS) per meal
      </text>
    </g>
  </g>

  <!-- Right: 3 Protein Tier Cards -->
  <!-- Card 1: Maintenance Target -->
  <g transform="translate(415, 130)" filter="url(#proteinCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#64748b"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Sedentary RDA Minimum (0.8 g/kg)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~0.36 g/lb • Prevents clinical deficiency</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">Basic organ, enzymatic &amp; cellular turnover</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#64748b">0.8g</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PER KG</text>
  </g>

  <!-- Card 2: Hypertrophy / Athletic -->
  <g transform="translate(415, 221)" filter="url(#proteinCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#8b5cf6"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Muscle Hypertrophy (1.6–2.2 g/kg)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~0.73–1.0 g/lb • Optimal muscle growth ceiling</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Morton et al. meta-analysis gold-standard</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#8b5cf6">1.6–2.2g</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PER KG</text>
  </g>

  <!-- Card 3: Fat Loss Deficit -->
  <g transform="translate(415, 312)" filter="url(#proteinCardGlow)">
    <rect width="335" height="78" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="78" rx="3" fill="#ec4899"/>
    <text x="24" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Fat-Loss Deficit (2.0–2.4+ g/kg)</text>
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">~0.9–1.1 g/lb • Protects lean muscle in deficit</text>
    <text x="24" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Highest TEF burn &amp; powerful satiety signaling</text>
    <text x="275" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ec4899">2.0–2.4g</text>
    <text x="275" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PER KG</text>
  </g>
</svg>
